{% extends "base.html" %}{% block title %}Comanda — Forn Baltà{% endblock %}{% block content %}<main class="mx-auto max-w-4xl px-5 py-12"><a href="/menu" class="font-bold underline">← Tornar a la carta</a><h1 class="mt-8 text-5xl font-black">Comanda per recollir</h1><p class="mt-3 text-stone-600">Envia la petició i l'equip confirmarà la disponibilitat.</p><div id="cart" class="mt-8 space-y-3"></div><form id="form" class="mt-10 space-y-5 rounded-3xl border bg-white p-6"><div class="grid gap-4 md:grid-cols-2"><label class="text-sm font-bold">Nom *<input required name="customer_name" class="mt-2 w-full rounded-xl border p-3"></label><label class="text-sm font-bold">Telèfon *<input required name="customer_phone" class="mt-2 w-full rounded-xl border p-3"></label><label class="text-sm font-bold">Data *<input required type="date" name="pickup_date" class="mt-2 w-full rounded-xl border p-3"></label><label class="text-sm font-bold">Hora *<select name="pickup_time" class="mt-2 w-full rounded-xl border p-3"><option>09:00</option><option>10:00</option><option>11:00</option><option>12:00</option><option>13:00</option><option>17:00</option><option>18:00</option><option>19:00</option><option>20:00</option></select></label></div><label class="text-sm font-bold">Notes<textarea name="notes" rows="3" class="mt-2 w-full rounded-xl border p-3"></textarea></label><div class="flex flex-col justify-between gap-4 border-t pt-5 sm:flex-row sm:items-center"><strong>Total: <span id="total">0,00 €</span></strong><button class="rounded-full bg-stone-950 px-7 py-3 font-black text-white">Enviar comanda</button></div><p id="msg" class="text-sm"></p></form></main><script>
const K="fb_cart",get=()=>JSON.parse(localStorage.getItem(K)||"[]"),eur=n=>n.toLocaleString("ca-ES",{style:"currency",currency:"EUR"});function render(){let c=get(),box=document.getElementById("cart"),t=c.reduce((s,x)=>s+x.price*x.qty,0);box.innerHTML=c.length?c.map(x=>`<div class="flex justify-between rounded-2xl border bg-white p-4"><div><b>${x.name}</b><div class="text-sm text-stone-500">Quantitat: ${x.qty}</div></div><b>${eur(x.price*x.qty)}</b></div>`).join(""):`<div class="rounded-2xl bg-amber-50 p-5">La comanda està buida. <a class="font-bold underline" href="/menu">Torna a la carta.</a></div>`;document.getElementById("total").textContent=eur(t)}render();document.getElementById("form").onsubmit=async e=>{e.preventDefault();let c=get();if(!c.length)return;let f=new FormData(e.target);let payload={customer_name:f.get("customer_name"),customer_phone:f.get("customer_phone"),pickup_date:f.get("pickup_date"),pickup_time:f.get("pickup_time"),notes:f.get("notes"),items:c.map(x=>({id:x.id,qty:x.qty}))};let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),j=await r.json();document.getElementById("msg").textContent=j.message;if(j.ok){localStorage.removeItem(K);e.target.reset();render()}};</script>{% endblock %}
