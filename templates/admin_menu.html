<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-stone-100"><main class="mx-auto max-w-6xl px-5 py-8"><a href="/admin" class="font-bold">← Dashboard</a><h1 class="mt-8 text-4xl font-black">Menu manager</h1><div class="mt-6 rounded-3xl bg-white p-6"><h2 class="font-black">Add product</h2><form method="post" class="mt-4 grid gap-3 md:grid-cols-4"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="action" value="save"><input name="name" required placeholder="Product" class="rounded-xl border p-3"><input name="description" placeholder="Description" class="rounded-xl border p-3"><input name="price" required type="number" step=".01" placeholder="Price" class="rounded-xl border p-3"><select name="category_id" class="rounded-xl border p-3">{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><button class="rounded-xl bg-stone-950 p-3 font-black text-white md:col-span-4">Add product</button></form></div><div class="mt-6 space-y-3">{% for p in products %}<div class="rounded-2xl bg-white p-5"><form method="post" class="grid gap-3 md:grid-cols-6"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="action" value="save"><input type="hidden" name="id" value="{{p.id}}"><input name="name" value="{{p.name}}" class="rounded-xl border p-3 font-bold"><input name="description" value="{{p.description or ''}}" class="rounded-xl border p-3"><input name="price" type="number" step=".01" value="{{p.price}}" class="rounded-xl border p-3"><select name="category_id" class="rounded-xl border p-3">{% for c in categories %}<option value="{{c.id}}" {% if c.id==p.category_id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select><label class="flex items-center gap-2"><input type="checkbox" name="featured" value="1" {% if p.featured %}checked{% endif %}>Featured</label><button class="rounded-xl bg-stone-950 p-3 font-bold text-white">Save</button></form><form method="post" class="mt-3 text-right"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="action" value="toggle"><input type="hidden" name="id" value="{{p.id}}"><button class="rounded-full px-4 py-2 text-sm font-bold {% if p.active %}bg-green-100 text-green-800{% else %}bg-red-100 text-red-800{% endif %}">{{"Active" if p.active else "Hidden"}}</button></form></div>{% endfor %}</div></main></body></html>
